# Animation at boot (default: no)
animate = no

# Set keyboard layout (blank for system default)
lang = us

# Number of tty to use (default: 2)
tty = 2

# Set default DE/WM
defaultwm = bspwm

# Enable desktop environment helper (default: no)
# This helps with loading environment variables and profiles
desktop_load = yes

# Load Xauthority (default: no)
load_xauth = yes

# Save login (default: no)
save_login = no

# Enable battery monitoring
enable_battery = yes

# Enable numlock on startup (default: no)
numlock = yes

# Time before removing service file
service_timeout = 0

# Hide enter key
hide_enter = no

# Hide borders around input fields
hide_borders = no

# Enable custom colors (default: no)
# If enabled, you can set colors below
custom_colors = yes

# Colors for different UI elements
# Format is RGB (like HTML but without #)
color_0 = 26233a  # background
color_1 = 9ccfd8  # foreground
color_2 = 908caa  # input
color_3 = eb6f92  # input error
