# Terminal
bind = SUPER,Return,exec,kitty
bind = SUPER SHIFT,Return,exec,kitty --name float --class float

# Rofi launcher
bind = SUPER,space,exec,rofi -show drun

# Power menu
bind = SUPER,Backspace,exec,sh ~/lib/scripts/wm/bspwm/color

# Lock screen
bind = SUPER,x,exec,hyprlock

# Reload Hyprland
bind = SUPER ALT,r,exec,hyprctl reload

# Language toggle
bind = SUPER ALT,l,exec,sh ~/lib/scripts/wm/bspwm/language

# Quit Hyprland
bind = SUPER ALT,q,exit,

# Close/kill window
bind = SUPER,w,killactive,
bind = SUPER SHIFT,w,exec,hyprctl killactive

# --- Mouse Bindings ---
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Fullscreen / floating
bind = SUPER,t,togglefloating,
bind = SUPER,s,fullscreen,

# Move focus
bind = SUPER,h,movefocus,l
bind = SUPER,j,movefocus,d
bind = SUPER,k,movefocus,u
bind = SUPER,l,movefocus,r

# Swap windows
bind = SUPER SHIFT,h,swapwindow,l
bind = SUPER SHIFT,j,swapwindow,d
bind = SUPER SHIFT,k,swapwindow,u
bind = SUPER SHIFT,l,swapwindow,r

# Resize windows
bind = SUPER ALT,h,resizeactive,-20 0
bind = SUPER ALT,j,resizeactive,0 20
bind = SUPER ALT,k,resizeactive,0 -20
bind = SUPER ALT,l,resizeactive,20 0
