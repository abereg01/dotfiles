# ~/.config/hypr/hyprland.conf

source = ~/.config/hypr/keybinds.conf

monitor=DP-2,3440x1440@100,3840x0,1
monitor=DP-3,3440x1440@60,3840x1440,1

exec-once = source ~/.config/hypr/autostart.sh

input {
    kb_layout = us
    follow_mouse = 1
    # natural_scroll = no # Keep this 'no' if you don't want it globally for *all* input devices
    # sensitivity = 1.0   # Keep this at default if you don't want it globally for *all* input devices

    touchpad {
        disable_while_typing = true
        clickfinger_behavior = true
        tap-to-click = true
        scroll_factor = 0.8
        natural_scroll = yes # APPLY NATURAL SCROLL TO ALL TOUCHPADS
    }

    device {
        magic-trackpad-2-mouse {
            # No specific natural_scroll or sensitivity here, as they are now in touchpad {}
        }
    }
}

decoration {
    rounding = 8

    blur {
        enabled = yes
        size = 5
        passes = 2
        new_optimizations = yes
        noise = 0.0117
        contrast = 0.8916
        brightness = 0.8172
    }

    shadow {
        enabled = yes
        range = 15
        render_power = 3
        color = rgba(1a1a1aee)
    }

    active_opacity = 1.0
    inactive_opacity = 0.85
    fullscreen_opacity = 1.0
}

animations {
    enabled = yes
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = windows, 1, 5, ease
    animation = fade, 1, 5, ease
}

bind = ,swipe:3:l,workspace,e+1
bind = ,swipe:3:r,workspace,e-1
bind = ,swipe:3:u,exec,hyprctl dispatch togglespecialworkspace
bind = ,swipe:3:d,exec,hyprctl dispatch togglespecialworkspace

bind = ,swipe:4:u,exec,~/.config/hypr/scripts/app_overview.sh
bind = ,swipe:4:d,exec,hyprctl dispatch killactive
bind = ,swipe:4:l,movefocus,l
bind = ,swipe:4:r,movefocus,r
