# ~/.config/hypr/hyprland.conf

source = ~/.config/hypr/keybinds.conf

monitor=DP-2,3440x1440@100,3840x0,1
monitor=DP-3,3440x1440@60,3840x1440,1

# General
exec-once = source ~/.config/hypr/autostart.sh

# Input
input {
  kb_layout = us
  follow_mouse = 1
  natural_scroll = no
  touchpad {
    disable_while_typing = false
    clickfinger_behavior = true
    tap-to-click = true
    scroll_factor = 0.8
  }
}

decoration {
  rounding = 8

  blur {
    enabled = yes
    size = 5
    passes = 2
    new_optimizations = yes
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
  }

  shadow {
    enabled = yes
    range = 15
    render_power = 3
    color = rgba(1a1a1aee)
  }

  active_opacity = 1.0
  inactive_opacity = 0.85
  fullscreen_opacity = 1.0
}

# Animations
animations {
  enabled = yes
  bezier = ease, 0.25, 0.1, 0.25, 1
  animation = windows, 1, 5, ease
  animation = fade, 1, 5, ease
}

