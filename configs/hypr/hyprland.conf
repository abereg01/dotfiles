# ~/.config/hypr/hyprland.conf

[input]
# Don’t automatically focus windows under the cursor…
follow_mouse = 0
# …but do track which monitor your pointer is on
mouse_move_focuses_monitor = true
# Re-hovering the same window won’t re-focus it unless you first leave it
mouse_refocus = 1

[cursor]
# Never warp the cursor when switching workspaces
WarpOnChangeWorkspace = 0
# Disable _all_ other dispatcher-driven cursor warps
NoWarps = true

[keybinds]
# Monitor-local workspaces
bind = SUPER,1,workspace,1
bind = SUPER,2,workspace,2
bind = SUPER,3,workspace,3
bind = SUPER,4,workspace,4
bind = SUPER,5,workspace,5

# Launchers
bind = SUPER,Return,exec,kitty
bind = SUPER,C,     exec,google-chrome-stable

# Reload on the fly
bind = SUPER,Shift,R,exec,hyprctl reload

